services:
  rental-api:
    build: ./rental-api
    image: ${DOCKERHUB_USER}/rental-service-rental-api:${IMAGE_TAG:-latest}
    #container_name: rental-api
    volumes:
      - rental_data:/data
    expose:
      - "5000"
    restart: unless-stopped
    environment:
      - CLEANING_SERVICE_URL=http://cleaning-service:5001

  cleaning-service:
    build: ./cleaning-service
    image: ${DOCKERHUB_USER}/rental-service-cleaning-service:${IMAGE_TAG:-latest}
    #container_name: cleaning-service
    volumes:
      - cleaning_data:/data
    expose:
      - "5001"
    restart: unless-stopped