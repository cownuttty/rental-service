services:
  rental-api:
    build: ./rental-api #собираем образ из этой папки
    image: ${DOCKERHUB_USER}/rental-service-rental-api:${IMAGE_TAG:-latest} #имя и тег
    #container_name: rental-api
    volumes:
      - rental_data:/data
    expose:
      - "5000" #порт доступен только внутри контейнера
    restart: unless-stopped #перезапускать при падении-перезагрузке хоста
    environment: #передача переменной окружения
      - CLEANING_SERVICE_URL=http://cleaning-service:5001 
  cleaning-service:
    build: ./cleaning-service
    image: ${DOCKERHUB_USER}/rental-service-cleaning-service:${IMAGE_TAG:-latest}
    #container_name: cleaning-service
    volumes:
      - cleaning_data:/data
    expose:
      - "5001"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine #готовый образ nginx
    container_name: nginx-gateway
    ports:
      - "8081:80" #единственная точка входа
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rental-api
      - cleaning-service
    restart: unless-stopped

volumes: #объявление именованных томов
  rental_data:
  cleaning_data: