events {
    worker_connections 1024;
}

http {
    # rental-api и cleaning-service - это имена сервисов из docker-compose.yml.
    # Docker Compose поднимает для них собственную внутреннюю DNS-сеть,
    # поэтому nginx может обращаться к ним просто по имени, как по хосту.
    upstream rental_api {
        server rental-api:5000;
    }

    upstream cleaning_service {
        server cleaning-service:5001;
    }

    server {
        listen 80;

        # Любой запрос вида /api/owners превращается в owners
        # и уходит в контейнер rental-api на порт 5000.
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://rental_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Любой запрос вида /cleaning/cleaning-tasks уходит
        # в контейнер cleaning-service на порт 5001.
        location /cleaning/ {
            rewrite ^/cleaning/(.*)$ /$1 break;
            proxy_pass http://cleaning_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            return 200 "nginx gateway ok\n";
            add_header Content-Type text/plain;
        }
    }
}
